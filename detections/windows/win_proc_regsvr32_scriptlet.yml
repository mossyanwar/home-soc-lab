title: Regsvr32 scriptlet (Squiblydoo) execution
id: 6b1d8f23-7c2a-4b5e-9a1c-3d7e2f5b8a05
status: experimental
description: >
  Detects regsvr32.exe loading a scriptlet with the /i: switch and scrobj.dll,
  the "Squiblydoo" technique, which proxies execution of a local or remote COM
  scriptlet through a signed binary. Atomic Red Team T1218.010 tests 1 and 2.
references:
  - https://attack.mitre.org/techniques/T1218/010/
  - https://lolbas-project.github.io/lolbas/Binaries/Regsvr32/
author: mossyanwar
date: 2026-06-14
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\regsvr32.exe'
    CommandLine|contains|all:
      - '/i:'
      - 'scrobj'
  condition: selection
falsepositives:
  - "Legitimate software registers COM objects with regsvr32, but normal registration does not use /i: with a scriptlet and scrobj.dll together."
level: high
tags:
  - attack.defense-evasion
  - attack.t1218.010
