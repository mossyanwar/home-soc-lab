title: Registry hive export of SAM, SYSTEM or SECURITY
id: 9a3e7d12-4c5b-4e9a-8b1d-6f2a0c7e4d03
status: experimental
description: >
  Detects reg.exe saving the SAM, SYSTEM or SECURITY hives to a file. Together
  these hives let an attacker recover local account password hashes and LSA
  secrets offline. Atomic Red Team T1003.002 test 1.
references:
  - https://attack.mitre.org/techniques/T1003/002/
author: mossyanwar
date: 2026-06-07
logsource:
  product: windows
  category: process_creation
detection:
  selection_cmd:
    Image|endswith: '\reg.exe'
    CommandLine|contains: 'save'
  selection_hive:
    CommandLine|contains:
      - 'hklm\sam'
      - 'hklm\system'
      - 'hklm\security'
  condition: selection_cmd and selection_hive
falsepositives:
  - Administrators and backup scripts occasionally export the SYSTEM hive.
    Exporting SAM or SECURITY is almost always malicious.
level: high
tags:
  - attack.credential-access
  - attack.t1003.002
