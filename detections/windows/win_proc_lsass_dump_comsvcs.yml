title: LSASS memory dump via comsvcs.dll MiniDump
id: 7c9d2a51-0d2a-4a8e-9f0a-2b7d1c4a9e01
status: experimental
description: >
  Detects the signed-binary LSASS dump where rundll32 calls the MiniDump
  export of comsvcs.dll against a process id, writing a dump to disk. This is
  Atomic Red Team T1003.001 test 2 and a very common hands-on-keyboard
  credential theft step.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://lolbas-project.github.io/lolbas/Libraries/comsvcs/
author: mossyanwar
date: 2026-06-14
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith: '\rundll32.exe'
  selection_cmd:
    CommandLine|contains|all:
      - 'comsvcs'
      - 'MiniDump'
  condition: selection_img and selection_cmd
falsepositives:
  - No legitimate use. comsvcs MiniDump is only invoked by tooling and
    operators, not by normal software.
level: high
tags:
  - attack.credential-access
  - attack.t1003.001
