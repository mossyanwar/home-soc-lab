title: Active Directory database dump via ntdsutil or shadow copy
id: 2f1b8c34-6e4d-4a1b-9c2e-5a7f0b3d1e02
status: experimental
description: >
  Detects two ways of stealing the AD database: ntdsutil creating an IFM
  install media set that contains ntds.dit, and vssadmin creating a volume
  shadow copy (the first step of copying ntds.dit or the registry hives off
  a live domain controller). Atomic Red Team T1003.003 tests 1 and 3.
references:
  - https://attack.mitre.org/techniques/T1003/003/
author: mossyanwar
date: 2026-06-19
logsource:
  product: windows
  category: process_creation
detection:
  selection_ntdsutil:
    Image|endswith: '\ntdsutil.exe'
    CommandLine|contains|all:
      - 'ac i ntds'
      - 'create full'
  selection_vss:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'create'
      - 'shadow'
  condition: selection_ntdsutil or selection_vss
falsepositives:
  - Backup software uses volume shadow copies routinely; scope the vssadmin
    branch to domain controllers, where interactive shadow-copy creation is
    rare, or baseline the backup service account.
  - ntdsutil IFM is used by administrators when promoting a replica DC.
level: high
tags:
  - attack.credential-access
  - attack.t1003.003
